# Security-only Dependabot configuration.
# Routine version upgrades are reviewed manually to avoid breaking production.
# Keep Dependabot security updates enabled in repository settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-dependency-fixes:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-action-fixes:
        applies-to: security-updates
        patterns:
          - "*"
