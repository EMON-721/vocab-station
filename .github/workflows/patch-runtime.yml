name: Verify patched React and Vite runtime dependencies
on:
  push:
    branches: [security/runtime-patches]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/runtime-patches
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply direct security patches
        run: pnpm up react@19.2.8 react-dom@19.2.8 react-server-dom-webpack@19.2.8 vite@8.1.6
      - name: Verify all application and security tests
        run: |
          pnpm exec tsc --noEmit
          node scripts/check-security.mjs
          node scripts/check-ingress.mjs
          node scripts/check-vocabulary.mjs
          node scripts/check-assessment-v3.mjs
          node scripts/check-access.mjs
          node scripts/check-gemini-assessment.mjs
          pnpm build
      - name: Commit patched manifest and lockfile after successful tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Security: patch React Server DOM and Vite"
            git push origin HEAD:security/runtime-patches
          fi
