name: Verify transitive dependency security patches
on:
  push:
    branches: [security/transitive-dependencies]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/transitive-dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Resolve patched dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify application and security tests
        run: |
          pnpm exec tsc --noEmit
          node scripts/check-security.mjs
          node scripts/check-ingress.mjs
          node scripts/check-vocabulary.mjs
          node scripts/check-assessment-v3.mjs
          node scripts/check-access.mjs
          node scripts/check-gemini-assessment.mjs
          pnpm build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Security: update patched transitive dependencies"
            git push origin HEAD:security/transitive-dependencies
          fi
