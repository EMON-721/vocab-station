name: Validate patched dependencies (isolated branch)
on:
  push:
    branches:
      - security/dependency-refresh
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update vulnerable Next.js packages
        run: pnpm up next@16.4.1 eslint-config-next@16.4.1
      - name: Verify security and build
        run: |
          pnpm exec tsc --noEmit
          node scripts/check-security.mjs
          node scripts/check-ingress.mjs
          node scripts/check-vocabulary.mjs
          node scripts/check-assessment-v3.mjs
          node scripts/check-access.mjs
          node scripts/check-gemini-assessment.mjs
          pnpm build
      - name: Commit lockfile and manifest only if verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Next.js to patched 16.4.1 after tests"
            git push origin HEAD:security/dependency-refresh
          fi
