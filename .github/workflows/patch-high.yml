name: Verify newer transitive advisory fixes
on:
  push:
    branches: [security/high-advisory-fixes]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/high-advisory-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: |
          pnpm exec tsc --noEmit
          node scripts/check-security.mjs
          node scripts/check-ingress.mjs
          node scripts/check-vocabulary.mjs
          node scripts/check-assessment-v3.mjs
          node scripts/check-access.mjs
          node scripts/check-gemini-assessment.mjs
          pnpm build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Security: patch undici and brace-expansion"
            git push origin HEAD:security/high-advisory-fixes
          fi
